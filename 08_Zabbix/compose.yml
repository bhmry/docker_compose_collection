services:
  postgres:
    image: postgres:latest
    container_name: zabbix_db
    networks:
      - internal-zabbix
    volumes:
      - /volume1/docker/zabbix_prod/db:/var/lib/postgresql/data:rw
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix_usr
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "zabbix", "-U", "zabbix_usr"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: on-failure:5

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:latest
    container_name: zabbix_server
    networks:
      - internal-zabbix
    ports:
      - 10051:10051
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: 5432
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix_usr
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /volume1/docker/zabbix_prod/export:/var/lib/zabbix/export:rw
      - /volume1/docker/zabbix_prod/snmp:/var/lib/zabbix/snmptraps:rw
      - /volume1/docker/zabbix_prod/alerts:/usr/lib/zabbix/alertscripts:ro
      - /volume1/docker/zabbix_prod/external:/usr/lib/zabbix/externalscripts:ro
      - /volume1/docker/zabbix_prod/dbscripts:/var/lib/zabbix/dbscripts:ro
      - /volume1/docker/zabbix_prod/modules:/var/lib/zabbix/modules:ro
      - /volume1/docker/zabbix_prod/enc:/var/lib/zabbix/enc:ro
      - /volume1/docker/zabbix_prod/keys:/var/lib/zabbix/ssh_keys:ro
      - /volume1/docker/zabbix_prod/mibs:/var/lib/zabbix/mibs:ro
    healthcheck:
      test: grep -qr "zabbix_server" /proc/*/status || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: on-failure:5
    depends_on:
      postgres:
        condition: service_healthy

  zabbix-dashboard:
    image: zabbix/zabbix-web-nginx-pgsql:latest
    container_name: zabbix_web
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: 5432
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix_usr
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${TZ:-Europe/Paris}
    volumes:
      - /volume1/docker/zabbix_prod/sharemodules:/usr/share/zabbix/modules/:ro
      - /volume1/docker/zabbix_prod/nginx:/etc/ssl/nginx:ro
    ports:
      - 8532:8080
    networks:
      - internal-zabbix
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.zabbix-dashboard.rule=Host(`${URL}`)
      - traefik.http.routers.zabbix-dashboard.service=zabbix-dashboard
      - traefik.http.routers.zabbix-dashboard.entrypoints=https
      - traefik.http.routers.zabbix-dashboard.tls=true
      - traefik.http.routers.zabbix-dashboard.middlewares=zabbix-compress
      - traefik.http.middlewares.zabbix-compress.compress=true
      - traefik.http.services.zabbix-dashboard.loadbalancer.server.port=8080
      - traefik.http.services.zabbix-dashboard.loadbalancer.passhostheader=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: on-failure:5
    depends_on:
      - zabbix-server

networks:
  internal-zabbix:
  proxy:
    external: true
