- name: Home
  # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
  # hide-desktop-navigation: true
  columns:
    - size: small
      widgets:
        - type: calendar
          first-day-of-week: monday

        - type: rss
          limit: 10
          collapse-after: 3
          cache: 12h
          feeds:
            - url: https://blog.tld/rss
              title: un blog

        - type: twitch-channels
          channels:
            - une-chaine
            - une-autre-chaine

    - size: full
      widgets:
        - type: group
          widgets:
            - type: hacker-news
            - type: lobsters

        - type: videos
          channels:
            - ID Video
            - ID Video

        - type: group
          widgets:
            - type: reddit
              subreddit: technology
              show-thumbnails: true
            - type: reddit
              subreddit: selfhosted
              show-thumbnails: true

    - size: small
      widgets:
        - type: weather
          location: Paris, France
          units: metric # or "imperial"
          hour-format: 24h # or "12h"
          # Optionally hide the location from being displayed in the widget
          # hide-location: true

        - type: monitor
          cache: 1m
          title: Services
          sites:
            - title: Jellyfin
              url: https://jellyfin.example.com
              icon: /assets/jellyfin-logo.png
            - title: Gitea
              url: https://gitea.example.com
              icon: /assets/gitea-logo.png
            - title: PDF
              url: https://pdf.example.com
              icon: /assets/pdf-logo.png
