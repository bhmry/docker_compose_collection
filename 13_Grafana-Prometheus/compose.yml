services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - /volume1/docker/prometheus_prod/config:/etc/prometheus/
      - /volume1/docker/prometheus_prod/data:/prometheus
      - /etc/TZ:/etc/TZ:ro
      - /etc/localtime:/etc/localtime:ro
    command:
      - "--web.route-prefix=/"
      - "--web.external-url=https://${URL_PROMETHEUS}/"
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    healthcheck:
      test: wget -nv -t1 --spider 'http://localhost:9090/'
      interval: 1m
      timeout: 30s
      retries: 3
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.prometheus.entrypoints=https
      - traefik.http.routers.prometheus.rule=Host(`${URL_PROMETHEUS}`)
      - traefik.http.routers.prometheus.tls=true
      - traefik.http.services.prometheus.loadbalancer.server.port=9090

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    user: ${PUID}:${PGID}
    ports:
      - 3000:3000
    volumes:
      - /volume1/docker/grafana_prod:/var/lib/grafana:rw
      - /volume1/docker/grafana_prod/grafana.ini:/etc/grafana/grafana.ini:ro
      - /volume1/docker/grafana_prod/datasources:/etc/grafana/provisioning/datasources:ro
      - /volume1/docker/grafana_prod/logs:/logs:rw
    depends_on:
      - prometheus
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.grafana.entrypoints=https
      - traefik.http.routers.grafana.rule=Host(`${URL_GRAFANA}`)
      - traefik.http.routers.grafana.tls=true
      - traefik.http.services.grafana.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
