services:
  wallos:
    image: bellamy/wallos:latest
    container_name: wallos
    restart: unless-stopped
    ports:
      - 8282:80
    environment:
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - /volume1/docker/wallos_prod/db:/var/www/html/db
      - /volume1/docker/wallos_prod/logos:/var/www/html/images/uploads/logos
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.wallos.entrypoints=https
      - traefik.http.routers.wallos.rule=Host(`${URL}`)
      - traefik.http.routers.wallos.tls=true
      - traefik.http.services.wallos.loadbalancer.server.port=80

networks:
  proxy:
    external: true
