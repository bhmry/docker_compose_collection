services:
  db:
    image: postgres:latest
    container_name: Gitea-DB
    hostname: gitea-db
    networks:
      - internal-db
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "gitea", "-U", "giteauser"]
      timeout: 45s
      interval: 10s
      retries: 10
    user: ${PUID}:${PGID}
    volumes:
      - /volume1/docker/gitea_prod/db:/var/lib/postgresql/data:rw
    environment:
      - POSTGRES_DB=gitea
      - POSTGRES_USER=giteauser
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    restart: on-failure:5

  web:
    image: gitea/gitea:latest
    container_name: Gitea
    hostname: gitea
    networks:
      - internal-db
      - proxy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1
    ports:
      - 3052:3000
      - 2223:22
    volumes:
      - /volume1/docker/gitea_prod/data:/data
      - /etc/TZ:/etc/TZ:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - USER_UID=${PUID}
      - USER_GID=${PGID}
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=gitea-db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=giteauser
      - GITEA__database__PASSWD=${DB_PASSWORD}
      - GITEA__server__ROOT_URL=https://${URL}/
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__SSH_PORT=2223
      - GITEA__server__SSH_LISTEN_PORT=22
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.gitea.rule=Host(`${URL}`)
      - traefik.http.routers.gitea.service=gitea
      - traefik.http.routers.gitea.entrypoints=https
      - traefik.http.routers.gitea.tls=true
      - traefik.http.routers.gitea.middlewares=gitea-compress
      - traefik.http.middlewares.gitea-compress.compress=true
      - traefik.http.services.gitea.loadbalancer.server.port=3000
      - traefik.http.services.gitea.loadbalancer.passhostheader=true
    restart: on-failure:5

networks:
  internal-db:
  proxy:
    external: true
