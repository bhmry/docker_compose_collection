services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - 8080:8080
      - 8443:8443
      - 6443:6443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /volume1/docker/traefik_prod/config:/etc/traefik:ro
      - /volume1/docker/traefik_prod/logs:/var/log/traefik:rw
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_USER}:${TOKEN}
      - traefik.http.routers.traefik-secure.entrypoints=https
      - traefik.http.routers.traefik-secure.rule=Host(`${URL}`)
      - traefik.http.routers.traefik-secure.middlewares=traefik-auth
      - traefik.http.routers.traefik-secure.service=api@internal
      - traefik.http.routers.traefik-secure.tls=true
      - traefik.http.routers.traefik-dashboard.entrypoints=dashboard
      - traefik.http.routers.traefik-dashboard.rule=Host(`${URL}`)
      - traefik.http.routers.traefik-dashboard.middlewares=traefik-auth
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard.tls=true

networks:
  proxy:
    name: proxy
