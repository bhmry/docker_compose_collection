services:
  db:
    image: postgres:latest
    container_name: Vaultwarden-DB
    hostname: vaultwarden-db
    networks:
      - internal
    mem_limit: 512m
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    user: ${PUID}:${PGID}
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "vaultwarden", "-U", "vaultwardenuser"]
      timeout: 45s
      interval: 10s
      retries: 10
    volumes:
      - /volume1/docker/vaultwarden_prod/db:/var/lib/postgresql/data:rw
    environment:
      POSTGRES_DB: vaultwarden
      POSTGRES_USER: vaultwardenuser
      POSTGRES_PASSWORD: ${PASSWORD}
    restart: on-failure:5

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: Vaultwarden
    hostname: vaultwarden
    networks:
      - proxy
      - internal
    mem_limit: 256m
    mem_reservation: 96m
    cpu_shares: 1024
    security_opt:
      - no-new-privileges:true
    user: ${PUID}:${PGID}
    volumes:
      - /volume1/docker/vaultwarden_prod/data:/data:rw
    environment:
      TZ: ${TZ:-Europe/Paris}
      ROCKET_PORT: 9443
      SIGNUPS_ALLOWED: false
      DATABASE_URL: postgresql://vaultwardenuser:${PASSWORD}@vaultwarden-db:5432/vaultwarden
      ADMIN_TOKEN: ${ADMINTOKEN}
      DISABLE_ADMIN_TOKEN: false
      DOMAIN: https://${URL}
      SMTP_HOST: ${SMTP}
      SMTP_FROM: ${MAIL}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURITY: starttls
      SMTP_USERNAME: ${MAIL}
      SMTP_PASSWORD: ${PASSWORD_MAIL}
    restart: on-failure:5
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.vaultwarden.entrypoints=https
      - traefik.http.routers.vaultwarden.rule=Host(`${URL}`)
      - traefik.http.routers.vaultwarden.tls=true
      - traefik.http.routers.vaultwarden.middlewares=SslHeader@file
      - traefik.http.services.vaultwarden.loadbalancer.server.port=9443

networks:
  internal:
  proxy:
    external: true
