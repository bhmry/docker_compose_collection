services:
  dashy:
    image: lissy93/dashy:latest
    container_name: Dashy
    volumes:
      - /volume1/docker/dashy_prod/config/conf.yml:/app/user-data/conf.yml
    ports:
      - 4000:8080
    environment:
      - NODE_ENV=production
      - UID=${PUID}
      - GID=${PGID}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '/app/services/healthcheck']
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.dashy.entrypoints=https
      - traefik.http.routers.dashy.rule=Host(`${URL}`)
      - traefik.http.routers.dashy.tls=true
      - traefik.http.services.dashy.loadbalancer.server.port=8080

networks:
  proxy:
    external: true
