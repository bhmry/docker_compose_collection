services:
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: always
    depends_on:
      nextcloud-db:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:80 || exit 1
      interval: 1m
      timeout: 30s
      retries: 3
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_HOST=nextcloud-db
      - APACHE_DISABLE_REWRITE_IP=1
      - TRUSTED_PROXIES=${PROXY_IP}
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=${URL}
    volumes:
      - /volume1/docker/nextcloud_prod/data:/data
      - /volume1/docker/nextcloud_prod/config:/var/www/html
    networks:
      - proxy
      - internal-db-nextcloud
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.nextcloud.entrypoints=https
      - traefik.http.routers.nextcloud.rule=Host(`${URL}`)
      - traefik.http.routers.nextcloud.tls=true
      - traefik.http.services.nextcloud.loadbalancer.server.port=80

  nextcloud-db:
    image: mariadb:latest
    container_name: nextcloud-db
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    restart: always
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 20s
      retries: 10
    volumes:
      - /volume1/docker/nextcloud_prod/db:/var/lib/mysql
    environment:
      - TZ=${TZ:-Europe/Paris}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD_ROOT}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    networks:
      - internal-db-nextcloud

networks:
  internal-db-nextcloud:
  proxy:
    external: true
