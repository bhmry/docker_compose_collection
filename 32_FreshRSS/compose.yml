services:
  freshrss:
    image: linuxserver/freshrss:latest
    container_name: freshrss
    mem_limit: 512m
    cpu_shares: 768
    volumes:
      - /data/freshrss/config:/config
    environment:
      TZ: ${TZ:-Europe/Paris}
      CRON_MIN: '2,32'
      FRESHRSS_ENV: production
      FRESHRSS_INSTALL: |-
        --api-enabled
        --base-url https://${URL}
        --db-base ${DB}
        --db-host fresh-db
        --db-port 5432
        --db-password ${DB_PASSWORD}
        --db-type pgsql
        --db-user ${DB_USERNAME}
        --default-user admin
        --language fr
    restart: on-failure:5
    ports:
      - 8555:80
    depends_on:
      fresh-db:
        condition: service_healthy
    healthcheck:
      test: curl --connect-timeout 15 --max-time 100 --silent --show-error --fail "http://localhost:80" > /dev/null
      interval: 1m
      timeout: 30s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.freshrss.entrypoints=https"
      - "traefik.http.routers.freshrss.rule=Host(`${URL}`)"
      - "traefik.http.routers.freshrss.tls=true"
      - "traefik.http.services.freshrss.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    networks:
      - proxy
      - fresh-internal  # for db

  fresh-db:
    image: postgres:latest
    container_name: fresh-db
    hostname: fresh-db
    mem_limit: 512m
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB}", "-U", "${DB_USERNAME}"]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: on-failure:5
    logging:
      options:
        max-size: 10m
    volumes:
      - /data/freshrss/db:/var/lib/postgresql/
    environment:
      POSTGRES_DB: ${DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command:
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=16MB
    networks:
      - fresh-internal

networks:
  fresh-internal:
  proxy:
    external: true
